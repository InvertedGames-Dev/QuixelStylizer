[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quixelstylizer"
version = "2.0.0"
description = "Stylize Quixel / Fab PBR surfaces and meshes for Exodus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "opencv-python==5.0.0.93",
    "pillow==12.3.0",
    "moderngl==5.12.0",
    "glcontext==3.0.0",
    "PySide6==6.9.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
mesh = ["pymeshlab==2023.12.post2"]

[project.scripts]
qs = "qs.cli:main"

[tool.setuptools.packages.find]
include = ["qs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
